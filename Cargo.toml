[workspace]
members = [
    "crates/rdf-core",
    "crates/rdf-analytics",
    "crates/ui",
    "crates/ui-desktop",
    "crates/ui-wasm",
    "crates/ui-desktop-mcp",
]
resolver = "3"

[workspace.dependencies]
base62 = "2.2"
bimap = "0.6"
bitflags = "2.12"
csv = "1.3"
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
indexmap = "2.14"
json-event-parser = "0.2.3"
nalgebra = "0.35"
ordered-float = "5.1"
oxrdf = "0.3"
percent-encoding = "2.3.2"
rand = "0.10.1"
rayon = "1.12"
rdf-analytics = { path = "crates/rdf-analytics" }
rdf-core = { path = "crates/rdf-core" }
rdf-glance = { path = "crates/ui" }
rmcp = "3.10"
schemars = "1"
serde = "1.0"
serde_json = "1.0"
slug = "0.1.6"
string-interner = "0.20"
strum = "0.28.0"
strum_macros = "0.28.0"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
xxhash-rust = "0.8"
