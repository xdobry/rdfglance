[workspace]
members = [
    "crates/rdf-core",
    "crates/rdf-analytics",
    "crates/ui",
    "crates/ui-desktop",
    "crates/ui-wasm",
    "crates/ui-desktop-mcp",
]
resolver = "3"

[workspace.dependencies]
base62 = "2.2.4"
bimap = "0.6.3"
bitflags = "2.12.1"
csv = "1.3.1"
eframe = "0.34.3"
egui = "0.34.3"
indexmap = "2.7.1"
json-event-parser = "0.2.3"
nalgebra = "0.35.0"
ordered-float = "5.1.0"
oxrdf = "0.3.1"
percent-encoding = "2.3.2"
rand = "0.10.1"
rayon = "1.10.0"
rdf-analytics = { path = "crates/rdf-analytics" }
rdf-core = { path = "crates/rdf-core" }
rdf-glance = { path = "crates/ui" }
rmcp = "3.10"
schemars = "1"
serde = "1.0.138"
serde_json = "1.0.138"
slug = "0.1.6"
string-interner = "0.20.0"
strum = "0.28.0"
strum_macros = "0.28.0"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
wasm-bindgen-futures = "0.4.73"
web-sys = "0.3.100"
xxhash-rust = "0.8.15"
