[package]
name = "rdf-glance"
version = "0.2.0"
edition = "2024"
autobins = false

[dependencies]
rdf-core = { workspace = true }
rdf-analytics = { workspace = true }
eframe = { workspace = true, features = ["persistence"] }
egui = { workspace = true, features = ["serde"] }
egui_extras = "0.37.0"
oxrdf = { workspace = true }
oxttl = "0.2.5"
rand = { workspace = true }
reqwest = {version="0.13.4", features = ["blocking"]}
rfd = "0.17.2"
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true }
indexmap = { workspace = true, features = ["rayon"] }
anyhow = "1.0.95"
oxrdfxml = "0.2.5"
bimap = { workspace = true }
const_format = "0.2.34"
byteorder = "1.5.0"
image = "0.25.10"
leb128 = "0.2.5"
flate2 = "1.1.1"
string-interner = { workspace = true }
unicode_names2 = "2.0.0"
rayon = { workspace = true }
atomic_float = "1.1.0"
strum = { workspace = true }
strum_macros = { workspace = true }
fixedbitset = "0.5.7"
csv = { workspace = true }
rust-sugiyama = "0.4.0"
nalgebra = { workspace = true }
lanczos = "0.2.0"
delaunator = "1.0.2"
quick-xml = "0.42.0"
bitflags = { workspace = true }
ordered-float = { workspace = true }
oxjsonld = "0.2.7"
percent-encoding = { workspace = true }
slug = { workspace = true }
xxhash-rust = { workspace = true, features = ["xxh3"] }
base62 = { workspace = true }
json-event-parser = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
peak_alloc = "0.3.0"
plotters = { version = "0.3.7", features = ["ab_glyph", "fontconfig-dlopen"] }
plotters-svg = "0.3.7"

[target.'cfg(windows)'.dependencies]
windows = "0.62.2"
windows-core = "0.62.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }
# this is needed to set 'js' feature in dependend older version from oxrdf
getrandom_2 = { package="getrandom", version = "0.3.4", features = ["wasm_js"] }
getrandom_3 = { package="getrandom", version = "0.2.17", features = ["js"] }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["UrlSearchParams", "Window", "Location"] }
poll-promise = { version = "0.3", features = ["web"] }
js-sys = "0.3.100"

[features]
# default = ["debug-orth"]
debug-orth = []
