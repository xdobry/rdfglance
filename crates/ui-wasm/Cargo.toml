[package]
name = "rdf-glance-wasm"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "egui_web_app"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["persistence"] }
rdf-glance = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["UrlSearchParams", "Window", "Location"] }
