[package]
name = "rdf-glance-wasm"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "egui_web_app"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.34.3", features = ["persistence"] }
rdf-glance = { path = "../ui" }
wasm-bindgen-futures = "0.4.73"
web-sys = { version = "0.3.100", features = ["UrlSearchParams", "Window", "Location"] }
