[package]
name = "rdf-glance-desktop"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "rdf-glance"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["persistence"] }
rdf-glance = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
