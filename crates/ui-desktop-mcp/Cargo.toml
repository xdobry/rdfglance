[package]
name = "rdf-glance-desktop-mcp"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "rdf-glance-mcp"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34.3", features = ["persistence"] }
rdf-glance = { path = "../ui" }
rdf-analytics = {path = "../rdf-analytics"}
axum = { version = "0.8", features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.10", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",    
] }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = {version="0.34.3", features=["serde"]}
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.10", features = ["client"] }
tokio = { version = "1", features = ["io-util"] }

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 0

[profile.release]
debug = 0
strip = true
