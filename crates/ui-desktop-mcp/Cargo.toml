[package]
name = "rdf-glance-desktop-mcp"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "rdf-glance-mcp"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["persistence"] }
rdf-glance = { workspace = true }
rdf-analytics = { workspace = true }
axum = { version = "0.8", features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
rmcp = { workspace = true, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",    
] }

tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
image = "0.25.10"
egui = { workspace = true, features = ["serde"] }
schemars = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["io-util"] }

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 0

[profile.release]
debug = 0
strip = true
